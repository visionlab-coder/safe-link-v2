services:
  postgres:
    image: postgres:16
    container_name: safelink-v3-postgres
    environment:
      POSTGRES_DB: safelink
      POSTGRES_USER: safelink
      POSTGRES_PASSWORD: safelink_dev_password
    ports:
      - "15432:5432"
    volumes:
      - safelink_v3_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safelink -d safelink"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: safelink-v3-redis
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - safelink_v3_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: safelink-v3-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: safelink
      MINIO_ROOT_PASSWORD: safelink_dev_minio_password
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - safelink_v3_minio:/data

volumes:
  safelink_v3_pg:
  safelink_v3_redis:
  safelink_v3_minio:
