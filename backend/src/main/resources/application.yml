server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SAFE_LINK_SESSION
        http-only: true
        secure: ${SAFE_LINK_COOKIE_SECURE:false}
        same-site: lax
        path: /
      timeout: ${SAFE_LINK_SESSION_IDLE_TIMEOUT:30m}

spring:
  config:
    import:
      - "optional:file:.env.local[.properties]"
      - "optional:file:../.env.local[.properties]"
  application:
    name: safe-link-v3-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/safelink}
    username: ${DB_USERNAME:safelink}
    password: ${DB_PASSWORD:safelink_dev_password}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:3000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT:1}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: redis
    timeout: ${SAFE_LINK_SESSION_IDLE_TIMEOUT:30m}
    redis:
      namespace: safelink:v3:session
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,objectStorage
        ai:
          include: aiGateway
        storage:
          include: objectStorage
  observations:
    key-values:
      application: safe-link-v3-backend

safe-link:
  cors:
    allowed-origins: ${SAFE_LINK_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    max-sessions-per-user: ${SAFE_LINK_MAX_SESSIONS_PER_USER:5}
  root-bootstrap:
    enabled: ${SAFE_LINK_ROOT_BOOTSTRAP_ENABLED:false}
    email: ${SAFE_LINK_ROOT_BOOTSTRAP_EMAIL:}
    password: ${SAFE_LINK_ROOT_BOOTSTRAP_PASSWORD:}
    display-name: ${SAFE_LINK_ROOT_BOOTSTRAP_DISPLAY_NAME:System Root}
    preferred-language: ${SAFE_LINK_ROOT_BOOTSTRAP_PREFERRED_LANGUAGE:ko}
    token: ${SAFE_LINK_ROOT_BOOTSTRAP_TOKEN:}
    confirm-token: ${SAFE_LINK_ROOT_BOOTSTRAP_CONFIRM_TOKEN:}
  ai:
    default-window-seconds: ${SAFE_LINK_AI_WINDOW_SECONDS:60}
    default-limit-count: ${SAFE_LINK_AI_LIMIT_COUNT:60}
    fail-open-local: ${SAFE_LINK_AI_FAIL_OPEN_LOCAL:false}
    vendor-enabled: ${SAFE_LINK_AI_VENDOR_ENABLED:false}
    google-cloud-api-key: ${GOOGLE_CLOUD_API_KEY:}
    naver-client-id: ${NAVER_CLIENT_ID:}
    naver-client-secret: ${NAVER_CLIENT_SECRET:}
    open-ai-api-key: ${OPENAI_API_KEY:}
    open-ai-text-model: ${OPENAI_TEXT_MODEL:gpt-4o-mini}
    open-ai-vision-model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
    internal-gateway-secret: ${TRAVEL_API_SECRET:}
    papago-timeout-ms: ${SAFE_LINK_AI_PAPAGO_TIMEOUT_MS:3000}
    google-timeout-ms: ${SAFE_LINK_AI_GOOGLE_TIMEOUT_MS:4000}
    open-ai-timeout-ms: ${SAFE_LINK_AI_OPENAI_TIMEOUT_MS:15000}
    speech-timeout-ms: ${SAFE_LINK_AI_SPEECH_TIMEOUT_MS:8000}
    tts-timeout-ms: ${SAFE_LINK_AI_TTS_TIMEOUT_MS:10000}
  storage:
    enabled: ${SAFE_LINK_STORAGE_ENABLED:false}
    bucket: ${SAFE_LINK_STORAGE_BUCKET:safe-link-local}
    region: ${SAFE_LINK_STORAGE_REGION:ap-northeast-2}
    endpoint: ${SAFE_LINK_STORAGE_ENDPOINT:}
    access-key: ${SAFE_LINK_STORAGE_ACCESS_KEY:}
    secret-key: ${SAFE_LINK_STORAGE_SECRET_KEY:}
    path-style-access: ${SAFE_LINK_STORAGE_PATH_STYLE:true}
    upload-url-ttl-seconds: ${SAFE_LINK_STORAGE_UPLOAD_TTL_SECONDS:600}
    download-url-ttl-seconds: ${SAFE_LINK_STORAGE_DOWNLOAD_TTL_SECONDS:300}
